[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-delivery-xray"
version = "0.1.0"
description = "麦当劳门店价差与覆盖分析：同一份麦当劳，走 200 米能便宜多少"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcdx = "mcd_delivery_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
