[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-pickup-vs-delivery"
version = "0.1.0"
description = "麦当劳自提 vs 外送：同一份餐的两条渠道实付拆解与出行成本对比"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcdx = "mcd_pickup_vs_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
